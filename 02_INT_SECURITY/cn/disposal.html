<!DOCTYPE html>
<html lang="zh">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>主动弃置</title>

    <link rel="stylesheet" href="../../assets/css/style.css">

</head>

<body>

<div class="container">

    <!-- =========================
         Header
    ========================== -->

    <header class="logo-area">

        <h1>

            SMART BOARDING

        </h1>

        <p>

            国际航班安检指南

            <span class="plane">

                ✈️

            </span>

        </p>

    </header>





    <!-- =========================
         Page Title
    ========================== -->

    <h2 class="page-title">

         🗑 主动弃置

    </h2>

    <p class="page-subtitle">

       请阅读以下说明。

    </p>




      <!-- Notice -->

    <section class="info-card notice-card">

        <h3 class="card-title">

            💡 请务必确认

        </h3>

        <p class="card-description">

            <br>

            <b>已弃置的物品
            无法取回。</b>

            <br><br>

            在弃置前，

            请务必先确认

            是否可以使用

            <strong>行李寄存服务</strong>

            或

            <strong>办理托运行李</strong>。

        </p>

    </section>



    <!-- Security Screening -->

     <section class="info-card">

        <h3 class="card-title">

            👮 安检现场弃置

        </h3>

         <p class="card-description">

            安检过程中

            被查获的物品

            将由安检工作人员

            统一回收处理。

            <br><br>

            <strong>

            如有疑问，

            请咨询安检工作人员。

            </strong>

         </p>

    </section>



    <!-- Disposal Process -->

     <section class="info-card">

        <h3 class="card-title">

            ♻️ 废弃物处理

        </h3>

        <p class="card-description">

            已弃置的物品

            将依据相关规定，

            通过捐赠等

            合法程序

            进行处理。

        </p>

    </section>

    
    <!-- =========================
         Footer
    ========================== -->

    <footer class="footer-logo">

        <img
            src="../../assets/images/logo/logo.png"
            alt="韩国机场安保 大邱机场分公司">

    </footer>





    <!-- =========================
         Back
    ========================== -->

    <a
        href="javascript:history.back()"
        class="back-button">

        ↩ 返回

    </a>

</div>

<script src="../../assets/js/language.js"></script>

</body>

</html>
