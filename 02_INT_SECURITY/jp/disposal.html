<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>自主廃棄</title>

    <link rel="stylesheet" href="../../assets/css/style.css">

</head>

<body>

<div class="container">

    <!-- =========================
         Header
    ========================== -->

    <header class="logo-area">

        <h1>

            SMART BOARDING

        </h1>

        <p>

            国際線保安検査案内

            <span class="plane">

                ✈️

            </span>

        </p>

    </header>





    <!-- =========================
         Page Title
    ========================== -->

    <h2 class="page-title">

         🗑 自主廃棄

    </h2>

    <p class="page-subtitle">

       以下のご案内を
       ご確認ください。

    </p>




      <!-- Notice -->

    <section class="info-card notice-card">

        <h3 class="card-title">

            💡 必ずご確認ください

        </h3>

        <p class="card-description">

            <br>

            <b>一度廃棄した物品は
            お返しできません。</b>

            <br><br>

            廃棄する前に、

            <strong>手荷物預かり所の利用</strong>

            または

            <strong>受託手荷物として預けること</strong>

            が可能か

            必ずご確認ください。

        </p>

    </section>



    <!-- Security Screening -->

     <section class="info-card">

        <h3 class="card-title">

            👮 保安検査場での廃棄

        </h3>

         <p class="card-description">

            保安検査で
            発見された物品は

            保安検査係員が
            回収・処理します。

            <br><br>

            <strong>

            保安検査係員へ
            お問い合わせください。

            </strong>

         </p>

    </section>



    <!-- Disposal Process -->

     <section class="info-card">

        <h3 class="card-title">

            ♻️ 廃棄物の処理

        </h3>

        <p class="card-description">

            廃棄された物品は

            関係法令に基づき、

            寄付などの

            適正な手続きを経て

            処理されます。

        </p>

    </section>

    
    <!-- =========================
         Footer
    ========================== -->

    <footer class="footer-logo">

        <img
            src="../../assets/images/logo/logo.png"
            alt="韓国空港保安 大邱空港支社">

    </footer>





    <!-- =========================
         Back
    ========================== -->

    <a
        href="javascript:history.back()"
        class="back-button">

        ↩ 戻る

    </a>

</div>

<script src="../../assets/js/language.js"></script>

</body>

</html>
