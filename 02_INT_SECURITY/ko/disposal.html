<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>자진 폐기</title>

    <link rel="stylesheet" href="../../assets/css/style.css">

</head>

<body>

<div class="container">

    <!-- =========================
         Header
    ========================== -->

    <header class="logo-area">

        <h1>

            SMART BOARDING

        </h1>

        <p>

            국제선 보안검색 안내

            <span class="plane">

                ✈️

            </span>

        </p>

    </header>

    <!-- =========================
         Page Title
    ========================== -->

    <h2 class="page-title">

         🗑 자진 폐기

    </h2>

    <p class="page-subtitle">

       아래 안내사항을 확인해주세요.

    </p>




      <!-- 안내 -->

    <section class="info-card notice-card">

        <h3 class="card-title">

            💡 꼭 확인해주세요

        </h3>

        <p class="card-description">

            <br>
            <b>폐기한 물품은 다시 찾을 수 없습니다.</b><br><br>

            폐기 하기 전,<br>
            <strong>보관소 이용</strong> 또는
            <strong>위탁수하물 처리</strong>가 가능한지
            반드시 확인한 후 결정해주세요.

        </p>

    </section>



    <!-- 보안검색 적발 -->

     <section class="info-card">


        <h3 class="card-title">

            👮 보안검색대 물품 폐기

        </h3>

         <p class="card-description">


            보안검색 중 적발된 물품은
            보안검색요원이 수거하여
            처리합니다.<br><br>

            <strong>보안검색요원에게 문의해주세요.</strong><br>
        

         </p>


    </section>


    <!-- 폐기 처리 -->

     <section class="info-card">


        <h3 class="card-title">

            ♻️ 폐기물 처리

        </h3>

        <p class="card-description">

            폐기된 물품은 관련 규정에 따라<br>
            기증 등 적법한 절차를 통해
            처리됩니다.

        </p>

    </section>


  


    <!-- =========================
         Footer
    ========================== -->

    <footer class="footer-logo">

        <img
            src="../../assets/images/logo/logo.png"
            alt="한국공항보안 대구공항지사">

    </footer>





    <!-- =========================
         Back
    ========================== -->

    <a
        href="javascript:history.back()"
        class="back-button">

        ↩ 돌아가기

    </a>

</div>

<script src="../../assets/js/language.js"></script>

</body>

</html>
