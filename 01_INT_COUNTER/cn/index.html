    <!-- =========================
         Script
    ========================== -->

    <script src="../../assets/js/language.js"></script>

    <script>

const popup = document.getElementById("popupOverlay");
const popupClose = document.getElementById("popupClose");

// 1 hour
const ONE_HOUR = 60 * 60 * 1000;

// Last confirmation time
const noticeTime = localStorage.getItem("smartNoticeTime");

// Hide popup if confirmed within the last hour
if (noticeTime && (Date.now() - Number(noticeTime) < ONE_HOUR)) {
    popup.style.display = "none";
}

// Confirmation button
popupClose.addEventListener("click", () => {

    popup.classList.add("hide");

    // Hide completely after animation
    setTimeout(() => {
        popup.style.display = "none";
    }, 300);

    // Save current time
    localStorage.setItem("smartNoticeTime", Date.now());

});

// =========================
// Language Selector
// =========================

const languageLinks = document.querySelectorAll("#languageMenu a");

languageLinks.forEach(link => {

    link.addEventListener("click", function(e){

        e.preventDefault();

        const lang = this.dataset.lang;

        // Save selected language
        localStorage.setItem("smartLanguage", lang);

        // Navigate to the same page in the selected language
        const currentPage = window.location.pathname.split("/").pop();

        location.href = `../${lang}/${currentPage}`;

    });

});



    </script>
